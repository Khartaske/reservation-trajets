<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Segoe UI, sans-serif">
  <rect x="0" y="0" width="800" height="560" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="52" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="24" y="33" font-size="18" font-weight="bold" fill="#111111">RésaTrajets</text>
