  <text x="60" y="470" font-size="12" fill="#555555">Le bouton Annuler n'apparaît que sur les réservations confirmées.</text>
  <text x="24" y="540" font-size="11" fill="#888888">Écran 5 — Mes réservations · GET /api/bookings · DELETE /api/bookings/&lt;id&gt;</text>
